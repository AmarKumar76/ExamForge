version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: ../infrastructure/docker/Dockerfile.client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: ../infrastructure/docker/Dockerfile.server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/examforge
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - redis
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../infrastructure/docker/Dockerfile.ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
